# Astro static build. `npm run build` runs `astro build` and then
# scripts/check-dist.mjs, so a dead link, a missing photo credit, a wrong
# canonical or brochure copy fails the deploy rather than shipping.
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Astro fingerprints these, so they can never go stale.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Trip photos are content-stable.
[[headers]]
  for = "/*/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The old single-trip site lived at the root. Keep those links alive.
[[redirects]]
  from = "/thailand"
  to = "/thai/"
  status = 301
